services:
  apps:
    build: ./apps
    image: elhaqy/simple-apps:master
    ports:
      - "10000:3000"
    restart: always
    env_file: ./apps/.env
    environment:
      - DB_HOST=db
    container_name: simple-apps
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: simple-apps-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: training
      MYSQL_USER: peserta
      MYSQL_PASSWORD: password
    volumes:
      - ./apps/database/training.sql:/docker-entrypoint-initdb.d/1-training.sql
    ports:
      - "3306:3306"
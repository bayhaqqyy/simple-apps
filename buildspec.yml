version: 0.2


phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      # Install dependencies inside apps folder
      - echo "Installing dependencies..."
      - cd apps
      - npm install
      - cd ..
      
      # Download and Install SonarScanner CLI
      - echo "Downloading SonarScanner..."
      - export SONAR_SCANNER_VERSION=5.0.1.3006
      - export SONAR_SCANNER_HOME=$HOME/.sonar/sonar-scanner-$SONAR_SCANNER_VERSION-linux
      - curl --create-dirs -sSLo $HOME/.sonar/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SONAR_SCANNER_VERSION-linux.zip
      - unzip -q $HOME/.sonar/sonar-scanner.zip -d $HOME/.sonar/
      - export PATH=$SONAR_SCANNER_HOME/bin:$PATH
      - export SONAR_SCANNER_OPTS="-server"

  pre_build:
    commands:
      # [TEST PHASE] 
      # Menjalankan tests dengan coverage di dalam folder apps
      - echo "Running tests and generating coverage..."
      - cd apps
      - npm test
      - npm run test:coverage || echo "Tests failed, but continuing for SonarQube analysis"
      - cd ..

      # [TEST PHASE]
      # Menjalankan SonarQube Analysis
      - echo "Running SonarQube analysis..."
      - sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN

  build:
    commands:
      # [BUILD PHASE]
      # Mempersiapkan artifact (file-file) yang akan dikirim ke tahap Deploy
      - echo "Preparing artifacts for Elastic Beanstalk deployment..."
      - echo "Deployment artifact will only contain contents of the apps/ folder."

artifacts:
  files:
    - '**/*'
  base-directory: apps
